<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  @font-face{font-family:'NotoSC';src:url('{{FONT_SC}}') format('woff2');font-weight:400 900;font-display:block;}
  @font-face{font-family:'InterLocal';src:url('{{FONT_INTER}}') format('woff2');font-weight:400 700;font-display:block;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1600px;height:1000px;overflow:hidden;}
  body{background:{{BG}};}
  .frame{position:relative;width:1600px;height:1000px;background:{{BG}};overflow:hidden;}
  .top{position:absolute;top:168px;left:96px;right:96px;display:flex;align-items:center;justify-content:space-between;font-family:'NotoSC',sans-serif;font-size:26px;letter-spacing:.18em;color:{{INK_SOFT}};}
  .top .cat{display:flex;align-items:center;gap:18px;}
  .top .bar{width:56px;height:4px;background:{{INK}};}
  .top .counter{font-family:'InterLocal',sans-serif;font-size:26px;letter-spacing:.1em;color:{{INK_SOFT}};}
  .headline{position:absolute;left:96px;top:50%;transform:translateY(-50%);width:1240px;font-family:'NotoSC',sans-serif;font-size:{{FS}}px;font-weight:700;line-height:1.24;letter-spacing:.01em;color:{{INK}};text-wrap:balance;word-break:keep-all;line-break:strict;}
  .bottom{position:absolute;left:96px;right:96px;bottom:172px;display:flex;align-items:flex-end;font-family:'InterLocal','NotoSC',sans-serif;font-size:24px;letter-spacing:.1em;color:{{INK_SOFT}};}
  .brand{display:flex;align-items:center;gap:12px;color:{{INK}};}
  .brand i{width:8px;height:8px;border-radius:50%;background:{{INK}};display:block;}
</style>
</head>
<body>
  <div class="frame">
    <div class="top"><span class="cat"><span class="bar"></span>{{CATEGORY}}</span><span class="counter">{{INDEX}} / {{TOTAL}}</span></div>
    <div class="headline">{{HEADLINE}}</div>
    <div class="bottom"><span class="brand"><i></i>个人商业创造者</span></div>
  </div>
</body>
</html>
