# XiaoBlog 站点 + 薄 API 反代。
# 本文件由 deploy/setup-ecs.sh 模板化生成；占位符在脚本里替换。
#
# 拓扑：
#   主站 80/443  → 静态 dist/，/api/ → 127.0.0.1:__API_PORT__（薄 API）

server {
    listen 80;
    listen [::]:80;
    server_name __SITE_HOST__;

    root __REPO_DIR__/dist;
    index index.html;

    # 上传体积 / 代理头
    client_max_body_size 2m;

    # 薄 API：路由本身已带 /api 前缀，原样转发，不去前缀。^~ 优先于静态资源正则。
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # 私有页 /d/：HTTP Basic Auth 挡住直链（页面本身仍 noindex）。
    # 凭据文件由部署脚本生成，600 权限，不进仓库。注意：Basic Auth 仅在 TLS 下才真正安全。
    location ^~ /d/ {
        auth_basic "Private area";
        auth_basic_user_file /etc/nginx/.xb-htpasswd;
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存（构建产物带内容 hash 的变体图/OG 图）
    location ~* \.(?:avif|webp|jpg|jpeg|png|svg|css|js|woff2?|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
