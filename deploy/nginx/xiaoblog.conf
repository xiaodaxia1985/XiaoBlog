# XiaoBlog 静态站点配置。
# 本文件由 deploy/setup-ecs.sh 模板化生成；占位符在脚本里替换。
#
# 拓扑：
#   主站 80/443  → 静态 dist/

server {
    listen 80;
    listen [::]:80;
    server_name __SITE_HOST__;

    root __REPO_DIR__/dist;
    index index.html;

    # 上传体积
    client_max_body_size 2m;

    # 私有页 /d/：HTTP Basic Auth 挡住直链（页面本身仍 noindex）。
    # 凭据文件由部署脚本生成，600 权限，不进仓库。注意：Basic Auth 仅在 TLS 下才真正安全。
    location ^~ /d/ {
        auth_basic "Private area";
        auth_basic_user_file /etc/nginx/.xb-htpasswd;
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存（构建产物带内容 hash 的变体图/OG 图）
    location ~* \.(?:avif|webp|jpg|jpeg|png|svg|css|js|woff2?|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 404 给站点自己的页面（Astro 产出 dist/404.html），而不是 nginx 默认页。
    # =404 保证状态码仍是 404；location 设 internal，避免 /404.html 被直接当正常页抓取收录。
    error_page 404 =404 /404.html;
    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
