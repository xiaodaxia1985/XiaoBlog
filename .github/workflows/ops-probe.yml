name: ops probe (read only)

# 临时只读勘查工作流：列 nginx 配置与证书现状，不修改任何文件。
# 用完即删（2026-11-20）。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe server read-only
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ECS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" '
            echo "=== sudo -n -l ==="
            sudo -n -l 2>&1 | tail -40
            echo "=== sudoers.d ==="
            ls -la /etc/sudoers.d/ 2>&1
            cat /etc/sudoers.d/* 2>&1 | head -40
            echo "=== can we reload nginx without password ==="
            sudo -n systemctl reload nginx --dry-run 2>&1 | head -3
            echo "=== can we run certbot without password ==="
            sudo -n certbot --version 2>&1 | head -2
          '
