name: ops probe (read only)

# 临时只读勘查工作流：列 nginx 配置与证书现状，不修改任何文件。
# 用完即删（2026-11-20）。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe server read-only
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ECS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" '
            echo "=== whoami ==="; whoami; id
            echo "=== sudo -n ==="; sudo -n true && echo "sudo NOPASSWD OK" || echo "sudo needs password or denied"
            echo "=== deploy.sh ==="; cat /opt/XiaoBlog/deploy.sh
            echo "=== certbot bin ==="; command -v certbot; ls -l /usr/bin/certbot 2>&1; sudo -n certbot --version 2>&1 | head -3
            echo "=== http server block (80) ==="
            sed -n "55,80p" /etc/nginx/conf.d/xiaoblog.conf
            echo "=== dist webroot ==="; ls -ld /opt/XiaoBlog/dist; ls /opt/XiaoBlog/dist | head -5
          '
