name: ops probe (read only)

# 临时只读勘查工作流：列 nginx 配置与证书现状，不修改任何文件。
# 用完即删（2026-11-20）。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe server read-only
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ECS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}" '
            echo "=== xiaoblog.conf ==="
            cat /etc/nginx/conf.d/xiaoblog.conf
            echo "=== nginx binary ==="
            command -v nginx || true; ps -ef | grep -E "nginx: master" | grep -v grep || true
            echo "=== nginx -V ==="
            (command -v nginx >/dev/null && nginx -V 2>&1) || true
            echo "=== ssl_certificate refs ==="
            grep -rn "ssl_certificate\|ssl_certificate_key" /etc/nginx/ 2>/dev/null | grep -v "^Binary"
            echo "=== letsencrypt ==="
            ls -la /etc/letsencrypt/live/ 2>/dev/null || true
            echo "=== acme.sh ==="
            ls -la /root/.acme.sh 2>/dev/null | head -20 || echo "no acme.sh"
            echo "=== other cert dirs ==="
            ls -la /etc/nginx/ssl /etc/pki/nginx 2>/dev/null || true
            echo "=== deploy dir ==="
            ls -la /opt/XiaoBlog/deploy/ 2>/dev/null
          '
